name: Deploy Nodejs Application to Hostinger
on:
 push:
  branches:
   - main

jobs:
 deploy:
  runs-on: ubuntu-latest
  steps:
   - name: Checkout code
     uses: actions/checkout@4

     
   - name: Deploy Via SSH
     uses: appleboy/ssh-action@v1.0.3
     with:
      host: ${{ secrets.SSH_HOST }}
      username: root
      key: ${{ secrets.SSH_KEY}}
      script:
        cd /root/nodejs-app-deploy-using-CICD-and-Github-actions
        git pull 
        docker compose up -d --build
